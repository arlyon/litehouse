---
name: Container validation

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Litehouse OCI (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Build native OCI image
        env:
          IMAGE: litehouse-phase1:${{ matrix.architecture }}
        run: docker build --tag "$IMAGE" --file Dockerfile .
      - name: Validate native OCI image
        env:
          IMAGE: litehouse-phase1:${{ matrix.architecture }}
        run: scripts/validate-oci-image.sh "$IMAGE" "${{ matrix.architecture }}"
