---
name: Rust CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  safety:
    name: T0 safety baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check workspace, sources, and CI authority
        run: python3 scripts/check-t0-baseline.py --skip-flatc

  test:
    name: Run tests
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-15
          targets: wasm32-wasip2
      - name: Install native linker
        run: sudo apt-get update && sudo apt-get install --yes mold
      - name: Install pinned flatc
        run: bash scripts/install-flatc.sh
      - name: Verify generated baseline
        run: python3 scripts/check-t0-baseline.py
      - name: Install pinned validation tools
        run: |
          cargo install cargo-groups --version 0.1.9 --locked
          cargo install wasm-tools --version 1.253.0 --locked
      - name: Run contract and service-fabric kernel tests
        run: |
          cargo test \
            -p litehouse-contracts \
            -p litehouse-plugin \
            -p litehouse-plugin-macro \
            -p litehouse-service-fabric \
            -p litehouse-rule-json \
            -p litehouse-mcp-server
          cargo run -p litehouse-contracts --bin contract-codegen -- --check
          generated="$(mktemp -d)"
          cargo run -p litehouse-contracts --bin contract-codegen -- --out "${generated}"
          python3 scripts/sync-contract-locks.py \
            --artifacts "${generated}/contract-artifacts-v1.json"
      - name: Build and validate representative components
        run: |
          cargo build --target wasm32-wasip2 \
            -p noop -p esphome -p tasmota -p ntfy -p open-meteo \
            -p litehouse-quantity-component \
            -p litehouse-service-fabric-provider-fixture \
            -p litehouse-service-fabric-consumer-fixture
          for component in \
            noop \
            esphome \
            tasmota \
            ntfy \
            open_meteo \
            litehouse_quantity_component \
            litehouse_service_fabric_provider_fixture \
            litehouse_service_fabric_consumer_fixture; do
            wasm-tools validate --features cm-async \
              "target/wasm32-wasip2/debug/${component}.wasm"
          done
          cargo run -p litehouse-service-fabric-harness -- \
            target/wasm32-wasip2/debug/litehouse_service_fabric_provider_fixture.wasm \
            target/wasm32-wasip2/debug/litehouse_service_fabric_consumer_fixture.wasm
          cargo run -p litehouse-contracts --bin validate-component -- \
            plugin target/wasm32-wasip2/debug/noop.wasm
          for component in esphome tasmota ntfy open_meteo; do
            cargo run -p litehouse-contracts --bin validate-component -- \
              provider "target/wasm32-wasip2/debug/${component}.wasm"
          done
          cargo run -p litehouse-contracts --bin validate-component -- \
            quantity-engine \
            target/wasm32-wasip2/debug/litehouse_quantity_component.wasm
          python3 - <<'PY'
          from pathlib import Path
          source = Path("target/wasm32-wasip2/debug/noop.wasm").read_bytes()
          old = b"wasi:random/insecure-seed@0.2.12"
          new = b"evil:random/insecure-seed@0.2.12"
          assert len(old) == len(new) and old in source
          Path("target/unreviewed-import.wasm").write_bytes(source.replace(old, new))
          PY
          if cargo run -p litehouse-contracts --bin validate-component -- \
            plugin target/unreviewed-import.wasm; then
            echo "validator accepted an unreviewed exact-interface import" >&2
            exit 1
          fi
          cargo run -p litehouse-quantity-parity -- \
            target/wasm32-wasip2/debug/litehouse_quantity_component.wasm
      - name: Run provider workflow integration tests
        run: bash scripts/test-provider-workflows.sh
      - name: Run binary tests
        run: cargo groups test bin

  build:
    name: Compile Litehouse
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-15
      - name: Install native linker
        run: sudo apt-get update && sudo apt-get install --yes mold
      - name: Install pinned flatc
        run: bash scripts/install-flatc.sh
      - name: Verify generated baseline
        run: python3 scripts/check-t0-baseline.py
      - name: Build Litehouse
        run: cargo build --release -p litehouse
      - name: Upload Litehouse binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: litehouse-binary
          path: target/release/litehouse
