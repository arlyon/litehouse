---
name: Release guard

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded:
    name: Confirm publishing is disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify non-publishing workflows
        run: python3 scripts/check-t0-baseline.py --skip-flatc
      - name: Explain release state
        run: |
          echo "Release publication is disabled during T0."
          echo "T5b must add the approved publisher and signing custody."
