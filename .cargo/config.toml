[build]
rustflags = ["--cfg", "tokio_unstable", "-Zthreads=16", "-Zpolonius=next"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "--cfg",
  "tokio_unstable",
  "-Zthreads=16",
  "-Zpolonius=next",
  "-C",
  "link-arg=-fuse-ld=mold",
]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
