apiVersion: v1
kind: Pod
metadata:
  name: litehouse
spec:
  containers:
    - name: server
      image: ghcr.io/arlyon/litehouse:latest
      env:
        - name: RUST_LOG
          value: debug,cranelift_codegen=info,rustls=info,wasmtime=info,wasmtime_cranelift=info
      volumeMounts:
        # Contains settings.json, schema.json, wasm/, and workflows/.
        - mountPath: /config
          name: config
  volumes:
    - name: config
      hostPath:
        path: /app
        type: DirectoryOrCreate
