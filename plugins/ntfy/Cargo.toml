[package]
name = "ntfy"
version = "0.1.0"
description = "Bounded ntfy notification-sink provider for Litehouse"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
readme = "readme.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.117"
url = "2.5.7"
wit-bindgen = { version = "0.59.0", features = ["async-spawn"] }
zeroize = "1.8.1"
