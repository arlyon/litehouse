[package]
name = "esphome"
version = "0.1.0"
description = "Typed ESPHome Native API provider for Litehouse"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
esphome-client = { version = "=0.2.0", default-features = false, features = [
  "api-1-14",
] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.48.0", features = [
  "io-util",
  "net",
  "rt",
  "sync",
  "time",
] }
wit-bindgen = "0.59.0"
zeroize = "1.8.1"

[dev-dependencies]
esphome-native-api = { version = "=2.1.0", default-features = false, features = [
  "std",
  "version_2026_6_2",
] }
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
