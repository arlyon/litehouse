# cargo-features = ["per-package-target"]

[package]
name = "tasmota"
version = "0.1.1"
publish = false
readme = "readme.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
futures = "0.3.31"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.9"
wit-bindgen = "0.59.0"
zeroize = "1.8.1"

[lib]
crate-type = ["cdylib"]
