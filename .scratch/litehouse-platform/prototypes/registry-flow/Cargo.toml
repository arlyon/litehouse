[workspace]
members = ["core", "parity-guest", "parity-host", "r2-smoke"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
ed25519-dalek = "2.2.0"
flatbuffers = "=25.12.19"
hex = "0.4.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
wit-bindgen = "0.59.0"
