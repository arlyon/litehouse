[package]
name = "litehouse-management"
version = "0.1.0"
description = "Canonical management handlers and thin MCP adapter for Litehouse"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
litehouse-contracts = { version = "0.1.0", path = "../litehouse-contracts" }
litehouse-provider-host = { version = "0.1.0", path = "../litehouse-provider-host" }
litehouse-service-fabric = { version = "0.1.0", path = "../litehouse-service-fabric" }
rmcp = { version = "=2.2.0", default-features = false, features = [
  "client",
  "macros",
  "server",
] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.48.0", features = [
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1.40"

[dev-dependencies]
anyhow = "1.0.86"
esphome-native-api = { version = "=2.1.0", default-features = false, features = [
  "std",
  "version_2026_6_2",
] }
wasmtime = "46.0.1"
zeroize = "1.8.1"
