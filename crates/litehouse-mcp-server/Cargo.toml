[package]
name = "litehouse-mcp-server"
version = "0.1.0"
description = "Bounded unauthenticated Streamable HTTP transport for Litehouse MCP"
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.4", default-features = false, features = [
  "http1",
  "tokio",
] }
futures-core = "0.3.31"
litehouse-management = { version = "0.1.0", path = "../litehouse-management" }
rmcp = { version = "=2.2.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = "0.7.17"
tracing = "0.1.40"

[dev-dependencies]
anyhow = "1.0.86"
bytes = "1.10.1"
futures = "0.3.31"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
rmcp = { version = "=2.2.0", default-features = false, features = [
  "client",
  "macros",
  "server",
  "transport-streamable-http-client",
  "transport-streamable-http-server",
] }
schemars = "1.0.4"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sse-stream = "0.2.1"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
