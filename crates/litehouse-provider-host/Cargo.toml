[package]
name = "litehouse-provider-host"
version = "0.1.0"
description = "Store-local Wasmtime host adapter for typed Litehouse providers"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
litehouse-contracts = { version = "0.1.0", path = "../litehouse-contracts" }
litehouse-service-fabric = { version = "0.1.0", path = "../litehouse-service-fabric" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"

[dev-dependencies]
anyhow = "1.0.86"
