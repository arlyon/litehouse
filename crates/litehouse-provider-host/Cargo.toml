[package]
name = "litehouse-provider-host"
version = "0.1.0"
description = "Store-local Wasmtime host adapter for typed Litehouse providers"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "1.7.1"
http-body-util = "0.1.2"
hyper = "1.4.1"
litehouse-contracts = { version = "0.1.0", path = "../litehouse-contracts" }
litehouse-service-fabric = { version = "0.1.0", path = "../litehouse-service-fabric" }
tokio = { version = "1.48.0", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
wasmtime = "46.0.1"
wasmtime-wasi = { version = "46.0.1", features = ["p3"] }
wasmtime-wasi-http = { version = "46.0.1", default-features = false, features = [
  "default-send-request",
  "p3",
] }

[dev-dependencies]
anyhow = "1.0.86"
esphome-native-api = { version = "=2.1.0", default-features = false, features = [
  "std",
  "version_2026_6_2",
] }
